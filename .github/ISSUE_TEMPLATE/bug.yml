name: Error (Bug)
description: Reportar un error en CineScope Admin
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del error
      description: Qué ocurre y qué debería ocurrir
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
        3. Observar ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué resultado esperabas
  - type: input
    id: branch
    attributes:
      label: Rama sugerida
      description: "Ejemplo: fix/reservation-status"
